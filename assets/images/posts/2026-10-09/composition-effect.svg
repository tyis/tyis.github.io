<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="中央値の推移と品質補正した推移のちがい(模式図)">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#ce-bg)" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="700">取引の「構成」が変わると、中央値は動く(模式図)</text>

  <!-- axes -->
  <g stroke="#475569" stroke-width="1">
    <line x1="80" y1="70" x2="80" y2="300"/>
    <line x1="80" y1="300" x2="740" y2="300"/>
    <line x1="80" y1="130" x2="740" y2="130" stroke-dasharray="3 5"/>
    <line x1="80" y1="190" x2="740" y2="190" stroke-dasharray="3 5"/>
    <line x1="80" y1="250" x2="740" y2="250" stroke-dasharray="3 5"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#94a3b8">
    <text x="72" y="304" text-anchor="end">低</text>
    <text x="72" y="74" text-anchor="end">高</text>
    <text x="80" y="322">時間 →</text>
    <text x="740" y="322" text-anchor="end">四半期</text>
  </g>

  <!-- raw median: jagged (composition shifts) -->
  <polyline fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"
    points="90,230 150,196 210,244 270,172 330,216 390,150 450,200 510,128 570,176 630,112 690,156 730,100"/>
  <!-- adjusted: smooth -->
  <polyline fill="none" stroke="#60a5fa" stroke-width="3" stroke-linejoin="round"
    points="90,236 150,226 210,214 270,204 330,192 390,180 450,166 510,154 570,140 630,128 690,116 730,106"/>

  <g font-family="sans-serif" font-size="12">
    <line x1="110" y1="346" x2="140" y2="346" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="148" y="350" fill="#fcd34d">取引価格の中央値(新築に近い大型物件が多い四半期は上がり、古い小型物件が多い四半期は下がる)</text>
    <line x1="110" y1="368" x2="140" y2="368" stroke="#60a5fa" stroke-width="3"/>
    <text x="148" y="372" fill="#93c5fd">品質補正した基準物件の㎡単価(築年・面積・駅距離をそろえた推定)</text>
  </g>
</svg>
